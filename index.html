<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akar Town — Exclusive Real Estate</title>
  <meta name="description" content="Akar Town — Discover exceptional luxury properties across Egypt's finest locations.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>
/* ─────────────────────────────────────────────
   DESIGN TOKENS
───────────────────────────────────────────── */
:root {
  --bg:           #FAF8F5;
  --ink:          #0D0D0D;
  --ink-60:       rgba(13,13,13,.60);
  --ink-30:       rgba(13,13,13,.30);
  --ink-10:       rgba(13,13,13,.10);
  --gold:         #C9A96E;
  --gold-lt:      #E4C99A;
  --gold-dk:      #A07C40;
  --red:          #CC2222;
  --white:        #FFFFFF;

  --glass-bg:     rgba(250,248,245,.72);
  --glass-border: rgba(255,255,255,.55);
  --glass-dark:   rgba(13,13,13,.08);

  --font-serif:   'Cormorant Garamond', Georgia, serif;
  --font-sans:    'DM Sans', system-ui, sans-serif;

  --nav-h:        80px;
  --thumb-w:      260px;
  --ease-smooth:  cubic-bezier(.76,0,.24,1);
  --ease-out-ex:  cubic-bezier(.16,1,.3,1);
}

/* ─────────────────────────────────────────────
   RESET
───────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-font-smoothing:antialiased; overflow-x:hidden; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  overflow-x: hidden;
  min-height: 100vh;
}
button { border:none; background:none; cursor:pointer; font-family:inherit; }
a { text-decoration:none; }
img { display:block; }

/* ─────────────────────────────────────────────
   NAVBAR
───────────────────────────────────────────── */
.navbar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 200;
  height: var(--nav-h);
  padding: 0 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--glass-bg);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 1px 0 var(--glass-border), 0 8px 40px var(--glass-dark);
}

.navbar__logo {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

.navbar__nav {
  display: flex;
  align-items: center;
  gap: 40px;
  list-style: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.navbar__nav a {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-60);
  position: relative;
  transition: color .3s ease;
}

.navbar__nav a::after {
  content: '';
  position: absolute;
  bottom: -3px; left: 0;
  width: 0; height: 1px;
  background: var(--gold);
  transition: width .4s var(--ease-smooth);
}

.navbar__nav a:hover { color: var(--ink); }
.navbar__nav a:hover::after { width: 100%; }

.navbar__actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-nav {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 10px 22px;
  border-radius: 5px;
  transition: all .3s ease;
  display: inline-flex;
  align-items: center;
}

.btn-nav--outline {
  color: var(--ink);
  border: 1px solid var(--ink-30);
}
.btn-nav--outline:hover {
  background: var(--ink);
  color: var(--white);
  border-color: var(--ink);
  transform: translateY(-1px);
}

/* ─────────────────────────────────────────────
   HERO SHELL
───────────────────────────────────────────── */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 640px;
  display: flex;
  padding-top: var(--nav-h);
  overflow: hidden;
}

/* ─────────────────────────────────────────────
   THUMBNAILS SIDEBAR
───────────────────────────────────────────── */
.hero__thumbs {
  position: relative;
  z-index: 30;
  width: var(--thumb-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 32px 20px;
  gap: 6px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-right: 1px solid var(--glass-border);
  box-shadow: 1px 0 0 var(--glass-border);
}

.thumb-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 14px;
  border-radius: 14px;
  cursor: pointer;
  border: 1px solid transparent;
  overflow: hidden;
  transition: all .45s var(--ease-smooth);
  outline: none;
}

.thumb-item::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: rgba(201,169,110,0);
  transition: background .45s ease;
}

.thumb-item:hover::after { background: rgba(201,169,110,.06); }

.thumb-item.is-active {
  border-color: var(--gold);
  background: rgba(201,169,110,.07);
  box-shadow: 0 0 0 1px rgba(201,169,110,.35), 0 6px 28px rgba(201,169,110,.18);
}

.thumb-item__img-wrap {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
  transition: all .45s var(--ease-smooth);
}

.thumb-item.is-active .thumb-item__img-wrap {
  width: 62px;
  height: 62px;
}

.thumb-item__img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .6s ease;
  will-change: transform;
}

.thumb-item:hover .thumb-item__img-wrap img { transform: scale(1.1); }

.thumb-item__meta {
  flex: 1;
  min-width: 0;
}

.thumb-item__num {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 4px;
}

.thumb-item__name {
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.thumb-item__bar {
  position: absolute;
  top: 14px; right: 0;
  width: 3px;
  height: 0;
  background: var(--gold);
  border-radius: 2px 0 0 2px;
  transition: height .45s var(--ease-smooth);
}

.thumb-item.is-active .thumb-item__bar { height: calc(100% - 28px); }

/* ─────────────────────────────────────────────
   HERO STAGE
───────────────────────────────────────────── */
.hero__stage {
  position: relative;
  flex: 1;
  overflow: hidden;
  perspective: 2400px;
  perspective-origin: 50% 50%;
}

/* Swiper overrides — stacked absolute slides */
#heroSwiper {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

#heroSwiper .swiper-wrapper {
  display: block !important;
  position: relative;
  width: 100%;
  height: 100%;
  transform: none !important;
}

#heroSwiper .swiper-slide {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  overflow: hidden;
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* ─────────────────────────────────────────────
   SLIDE BACKGROUND
───────────────────────────────────────────── */
.slide-bg {
  position: absolute;
  inset: -6%;
  width: 112%;
  height: 112%;
  background-size: cover;
  background-position: center;
  will-change: transform;
}

/* Cinematic overlay — gradient from left */
.slide-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(105deg,
      rgba(5,5,5,.72)  0%,
      rgba(5,5,5,.38) 44%,
      rgba(5,5,5,.08) 75%,
      rgba(5,5,5,.00) 100%
    ),
    linear-gradient(0deg,
      rgba(5,5,5,.55) 0%,
      rgba(5,5,5,.00) 40%
    );
}

/* Cylinder-roll shading veil — darkens slide as it rotates around the drum */
.slide-edge-light {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  pointer-events: none;
  opacity: 0;
  will-change: opacity;
}

/* ─────────────────────────────────────────────
   SLIDE CONTENT
───────────────────────────────────────────── */
.slide-content {
  position: absolute;
  bottom: 88px;
  left: 64px;
  max-width: 560px;
  z-index: 5;
}

.slide-eyebrow {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 22px;
  will-change: transform, opacity, filter;
}

.slide-eyebrow__rule {
  width: 28px;
  height: 1px;
  background: var(--gold);
  flex-shrink: 0;
}

.slide-eyebrow__label {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold-lt);
}

.slide-title {
  font-family: var(--font-serif);
  font-size: clamp(40px, 5.2vw, 76px);
  font-weight: 300;
  line-height: 1.02;
  color: var(--white);
  margin-bottom: 14px;
  will-change: transform, opacity, filter;
}

.slide-tagline {
  font-family: var(--font-serif);
  font-size: clamp(17px, 1.7vw, 22px);
  font-weight: 300;
  font-style: italic;
  color: rgba(255,255,255,.68);
  margin-bottom: 14px;
  will-change: transform, opacity, filter;
}

.slide-location {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 38px;
  will-change: transform, opacity, filter;
}

.slide-location__icon {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  opacity: .55;
  color: var(--white);
}

.slide-location__text {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,.55);
}

.slide-ctas {
  display: flex;
  align-items: center;
  gap: 14px;
  will-change: transform, opacity, filter;
}

/* CTA Buttons */
.btn-slide {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .13em;
  text-transform: uppercase;
  padding: 14px 30px;
  border-radius: 7px;
  transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
  cursor: pointer;
}

.btn-slide:hover { transform: translateY(-2px); }

.btn-slide--fill {
  background: var(--gold);
  color: var(--ink);
  box-shadow: 0 4px 20px rgba(201,169,110,.35);
}

.btn-slide--fill:hover {
  background: var(--gold-lt);
  box-shadow: 0 10px 36px rgba(201,169,110,.52);
}

.btn-slide--fill svg { transition: transform .3s ease; }
.btn-slide--fill:hover svg { transform: translateX(3px); }

.btn-slide--ghost {
  color: var(--white);
  border: 1px solid rgba(255,255,255,.38);
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.btn-slide--ghost:hover {
  background: rgba(255,255,255,.18);
  border-color: rgba(255,255,255,.7);
  box-shadow: 0 8px 28px rgba(0,0,0,.18);
}

/* ─────────────────────────────────────────────
   NAVIGATION ARROWS
───────────────────────────────────────────── */
.hero__nav {
  position: absolute;
  bottom: 44px;
  right: 52px;
  display: flex;
  gap: 10px;
  z-index: 40;
}

.nav-btn {
  position: relative;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
  color: var(--ink);
  cursor: pointer;
  transition: background .35s ease, border-color .35s ease, box-shadow .35s ease, transform .25s ease;
  outline: none;
}

.nav-btn:hover {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 8px 32px rgba(201,169,110,.42);
  transform: scale(1.06);
}

.nav-btn:hover svg { color: var(--ink); }

.nav-btn:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.nav-btn svg {
  width: 18px;
  height: 18px;
  transition: transform .25s ease, color .3s ease;
}

.nav-btn--prev:hover svg { transform: translateX(-2px); }
.nav-btn--next:hover svg { transform: translateX(2px); }

/* Magnetic wrapper */
.nav-btn__mag {
  position: absolute;
  inset: -14px;
}

/* ─────────────────────────────────────────────
   PROGRESS INDICATOR
───────────────────────────────────────────── */
.hero__progress {
  position: absolute;
  bottom: 58px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 40;
  user-select: none;
}

.progress__num {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 300;
  color: var(--white);
  min-width: 26px;
  line-height: 1;
}

.progress__track {
  width: 140px;
  height: 1px;
  background: rgba(255,255,255,.22);
  position: relative;
  overflow: hidden;
}

.progress__fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--gold);
  transform-origin: left;
  transform: scaleX(0);
  will-change: transform;
}

.progress__total {
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 300;
  color: rgba(255,255,255,.42);
  min-width: 20px;
  line-height: 1;
}

/* ─────────────────────────────────────────────
   LIQUID GLASS DETAIL — decorative corner
───────────────────────────────────────────── */
.hero__glass-tag {
  position: absolute;
  top: 28px;
  right: 40px;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 100px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 4px 20px var(--glass-dark);
}

.hero__glass-tag__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  animation: pulse 2.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(.7); }
}

.hero__glass-tag__text {
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-60);
}

/* ─────────────────────────────────────────────
   RESPONSIVE
───────────────────────────────────────────── */
@media (max-width: 1100px) {
  :root { --thumb-w: 210px; }
  .slide-content { left: 44px; }
}

@media (max-width: 768px) {
  .navbar { padding: 0 20px; }
  .navbar__nav { display: none; }

  .hero {
    flex-direction: column;
    height: auto;
    min-height: 100dvh;
  }

  .hero__thumbs {
    width: 100%;
    height: 90px;
    flex-direction: row;
    justify-content: flex-start;
    order: 2;
    padding: 10px 16px;
    gap: 10px;
    border-right: none;
    border-top: 1px solid var(--glass-border);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    flex-shrink: 0;
  }

  .hero__thumbs::-webkit-scrollbar { display: none; }

  .thumb-item {
    flex-direction: row;
    flex-shrink: 0;
    width: auto;
    min-width: 140px;
    padding: 8px 10px;
    border-radius: 10px;
    gap: 10px;
  }

  .thumb-item__bar { display: none; }

  .thumb-item__img-wrap,
  .thumb-item.is-active .thumb-item__img-wrap {
    width: 40px;
    height: 40px;
  }

  .hero__stage {
    order: 1;
    flex: 1;
    min-height: calc(100dvh - 90px - var(--nav-h));
  }

  .slide-content { left: 22px; right: 22px; bottom: 70px; }
  .slide-title { font-size: 34px; }

  .hero__nav { bottom: 12px; right: 20px; }
  .hero__progress { bottom: 22px; }
  .hero__glass-tag { top: 14px; right: 16px; }
}

/* ─────────────────────────────────────────────
   REDUCED MOTION
───────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .slide-bg,
  .slide-edge-light,
  .slide-content * {
    transition: none !important;
    animation: none !important;
    transform: none !important;
  }
}

/* ─────────────────────────────────────────────
   LOADING SCREEN
───────────────────────────────────────────── */
.loader {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 24px;
  pointer-events: none;
}

.loader__logo {
  opacity: 0;
}

.loader__bar-track {
  width: 120px;
  height: 1px;
  background: var(--ink-10);
  overflow: hidden;
}

.loader__bar {
  width: 0%;
  height: 100%;
  background: var(--gold);
  transition: width .6s var(--ease-out-ex);
}

/* ─────────────────────────────────────────────
   SCROLL HINT
───────────────────────────────────────────── */
.scroll-hint {
  position: absolute;
  bottom: 54px;
  left: 64px;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
}

.scroll-hint__line {
  width: 1px;
  height: 44px;
  background: linear-gradient(to bottom, var(--gold), transparent);
  animation: scrollLine 2s ease-in-out infinite;
}

@keyframes scrollLine {
  0% { transform: scaleY(0); transform-origin: top; }
  45% { transform: scaleY(1); transform-origin: top; }
  55% { transform: scaleY(1); transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}

.scroll-hint__label {
  font-size: 9px;
  font-weight: 400;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,.42);
  writing-mode: vertical-lr;
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════

   Swiper.js + GSAP | Book-Flip Transition
══════════════════════════════════════════════ */

/* ── GSAP Custom Eases ── */

CustomEase.create('text.in',  '0.16, 1, 0.3, 1');

/* ── Slide Data ── */
const SLIDES = [
  {

    thumb:   'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=300&auto=format&fit=crop&q=70',

  {

    location:'6th of October, Egypt',
    image:   'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1400&auto=format&fit=crop&q=80',
    thumb:   'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=300&auto=format&fit=crop&q=70',
  },
  {
    title:   'Sky Gardens',
    tagline: 'Nature Meets Architecture',
    location:'North Coast, Egypt',
    image:   'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=1400&auto=format&fit=crop&q=80',
    thumb:   'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=300&auto=format&fit=crop&q=70',
  },
  {
    title:   'The Boulevard',
    tagline: 'Live at the Center of Everything',
    location:'Sheikh Zayed, Egypt',
    image:   'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1400&auto=format&fit=crop&q=80',
    thumb:   'https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=300&auto=format&fit=crop&q=70',
  },
];

const AUTOPLAY_MS  = 7000;
const ROLL_MS      = 920;
const REDUCED      = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── State ── */
let activeIdx    = 0;
let isAnimating  = false;
let autoTimer    = null;
let progTween    = null;
let swiper       = null;

/* ── DOM refs ── */
const thumbsWrap = document.getElementById('heroThumbs');
const swiperWrap = document.getElementById('swiperWrapper');
const progCurrent= document.getElementById('progCurrent');
const progTotal  = document.getElementById('progTotal');
const progFill   = document.getElementById('progFill');
const prevBtn    = document.getElementById('heroPrev');
const nextBtn    = document.getElementById('heroNext');
const srAnnouncer= document.getElementById('srAnnouncer');
const loaderEl   = document.getElementById('loader');
const loaderBar  = document.getElementById('loaderBar');
const scrollHint = document.getElementById('scrollHint');

/* ════════════════════════════════════
   BUILD DOM
═════════════════════════════════════ */
function buildDOM() {
  /* Slides */
  SLIDES.forEach((data, i) => {
    const slide = document.createElement('div');
    slide.className  = 'swiper-slide';
    slide.dataset.idx = i;
    slide.setAttribute('role', 'tabpanel');
    slide.setAttribute('aria-label', data.title);
    slide.setAttribute('aria-roledescription', 'slide');

    slide.innerHTML = `
      <div class="slide-bg" style="background-image:url('${data.image}')" aria-hidden="true"></div>
      <div class="slide-overlay" aria-hidden="true"></div>
      <div class="slide-edge-light" aria-hidden="true"></div>
      <div class="slide-content">
        <div class="slide-eyebrow">
          <span class="slide-eyebrow__rule"></span>
          <span class="slide-eyebrow__label">Exclusive Property</span>
        </div>
        <h2 class="slide-title">${data.title}</h2>
        <p class="slide-tagline">${data.tagline}</p>
        <div class="slide-location">
          <svg class="slide-location__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <span class="slide-location__text">${data.location}</span>
        </div>
        <div class="slide-ctas">
          <a href="#" class="btn-slide btn-slide--fill" aria-label="Explore ${data.title}">
            Explore Project
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
          <a href="#" class="btn-slide btn-slide--ghost" aria-label="View details of ${data.title}">View Details</a>
        </div>
      </div>
    `;

    swiperWrap.appendChild(slide);
  });

  /* Thumbnails */
  SLIDES.forEach((data, i) => {
    const btn = document.createElement('button');
    btn.className = 'thumb-item' + (i === 0 ? ' is-active' : '');
    btn.dataset.idx = i;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-label', `View ${data.title}`);
    btn.setAttribute('tabindex', i === 0 ? '0' : '-1');

    btn.innerHTML = `
      <div class="thumb-item__img-wrap">
        <img src="${data.thumb}" alt="${data.title}" loading="${i === 0 ? 'eager' : 'lazy'}">
      </div>
      <div class="thumb-item__meta">
        <div class="thumb-item__num">0${i + 1}</div>
        <div class="thumb-item__name">${data.title}</div>
      </div>
      <div class="thumb-item__bar"></div>
    `;

    btn.addEventListener('click', () => navigate(i));
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigate(i); }
    });

    thumbsWrap.appendChild(btn);
  });
}

/* ════════════════════════════════════
   HELPERS
═════════════════════════════════════ */
const getSlide = (i) => document.querySelector(`.swiper-slide[data-idx="${i}"]`);
const getThumb = (i) => document.querySelector(`.thumb-item[data-idx="${i}"]`);

function pad(n) { return String(n + 1).padStart(2, '0'); }

function setProgress(i) {
  progCurrent.textContent = pad(i);
}

function announce(text) {
  srAnnouncer.textContent = '';
  requestAnimationFrame(() => { srAnnouncer.textContent = text; });
}

/* ════════════════════════════════════
   AUTOPLAY PROGRESS BAR
═════════════════════════════════════ */
function startProgBar() {
  if (progTween) progTween.kill();
  gsap.set(progFill, { scaleX: 0, transformOrigin: 'left' });
  progTween = gsap.to(progFill, {
    scaleX: 1,
    duration: AUTOPLAY_MS / 1000,
    ease: 'none',
  });
}

function pauseProgBar() {
  if (progTween) progTween.pause();
}

function resumeProgBar() {
  if (progTween) progTween.resume();
}

/* ════════════════════════════════════
   AUTOPLAY
═════════════════════════════════════ */
function startAutoplay() {
  clearAutoplay();
  startProgBar();
  autoTimer = setTimeout(() => {
    navigate((activeIdx + 1) % SLIDES.length);
  }, AUTOPLAY_MS);
}

function clearAutoplay() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  pauseProgBar();
}

function pauseAutoplay() { clearAutoplay(); }
function resumeAutoplay() { startAutoplay(); }

/* ════════════════════════════════════
   TEXT ANIMATIONS
═════════════════════════════════════ */
function textIn(slideEl) {
  if (REDUCED) return;
  const els = [
    slideEl.querySelector('.slide-eyebrow'),
    slideEl.querySelector('.slide-title'),
    slideEl.querySelector('.slide-tagline'),
    slideEl.querySelector('.slide-location'),
    slideEl.querySelector('.slide-ctas'),
  ].filter(Boolean);

  gsap.killTweensOf(els);
  gsap.set(els, { opacity: 0, y: 28, filter: 'blur(10px)' });

  const tl = gsap.timeline();
  els.forEach((el, i) => {
    tl.to(el, {
      opacity: 1, y: 0, filter: 'blur(0px)',
      duration: 0.78,
      ease: 'text.in',
    }, i * 0.11);
  });

  return tl;
}

function textOut(slideEl) {
  if (REDUCED) return;
  const els = slideEl.querySelectorAll('.slide-eyebrow, .slide-title, .slide-tagline, .slide-location, .slide-ctas');
  gsap.killTweensOf(els);
  return gsap.to([...els].reverse(), {
    opacity: 0, y: -16, filter: 'blur(6px)',
    duration: 0.35, ease: 'power2.in', stagger: 0.06,
  });
}

/* ════════════════════════════════════
   ROLLER / DRUM TRANSITION
   Both slides rotate around their own
   centre axis — like a spinning barrel.
   fromSlide rolls off; toSlide rolls on.
═════════════════════════════════════ */
function doRoll(fromIdx, toIdx) {
  const fromSlide  = getSlide(fromIdx);
  const toSlide    = getSlide(toIdx);
  if (!fromSlide || !toSlide) return;

  const fromBg    = fromSlide.querySelector('.slide-bg');
  const toBg      = toSlide.querySelector('.slide-bg');
  const fromShade = fromSlide.querySelector('.slide-edge-light');
  const toShade   = toSlide.querySelector('.slide-edge-light');

  /* dir: -1 = going forward (next), roll left
          +1 = going back (prev),    roll right */
  const dir  = toIdx > fromIdx ? -1 : 1;
  const DUR  = ROLL_MS / 1000;        // total roll duration in seconds
  const PERSP = 1600;                 // perspective distance — tighter = more dramatic

  /* ── Initial state ── */
  /* toSlide starts edge-on from the incoming direction */
  gsap.set(toSlide, {
    zIndex: 1,
    display: 'block',
    visibility: 'visible',
    rotationY: dir * -90,            // incoming: edge-on from the other side
    transformPerspective: PERSP,
    transformOrigin: 'center center',
  });
  gsap.set(fromSlide, {
    zIndex: 2,
    rotationY: 0,
    transformPerspective: PERSP,
    transformOrigin: 'center center',
  });
  gsap.set(toBg,   { scale: 1.055, x: dir * 20 });
  gsap.set(toShade,   { opacity: 0.65 }); /* incoming starts dark — in shadow */
  gsap.set(fromShade, { opacity: 0 });

  /* Text out */
  textOut(fromSlide);

  /* Preload upcoming */
  const preImg = new Image();
  preImg.src = SLIDES[(toIdx + 1) % SLIDES.length].image;

  const tl = gsap.timeline({
    onComplete: () => {
      gsap.set(fromSlide, {
        display: 'none', visibility: 'hidden',
        zIndex: 0, rotationY: 0, opacity: 1,
      });
      gsap.set(toSlide, { zIndex: 2 });
      gsap.set([fromShade, toShade], { opacity: 0 });
      isAnimating = false;
      textIn(toSlide);
      startAutoplay();
    }
  });

  if (REDUCED) {
    /* Simple crossfade for reduced motion */
    gsap.set([fromShade, toShade], { opacity: 0 });
    gsap.set(toSlide, { rotationY: 0 });
    tl.to(fromSlide, { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 0)
      .to(toSlide,   { opacity: 1, duration: 0.4, ease: 'power2.inOut' }, 0)
      .add(() => { gsap.set(fromSlide, { opacity: 1 }); });

  } else {
    /* ── CYLINDER DRUM ROLL ── */
    tl
      /* 1. FROM slide rolls off — rotates to edge */
      .to(fromSlide, {
        rotationY: dir * 90,           /* rolls off to the side */
        duration: DUR,
        ease: 'power3.inOut',
        onComplete: () => {
          gsap.set(fromSlide, { visibility: 'hidden' });
        },
      }, 0)

      /* 2. TO slide rolls on — comes from edge to face-on */
      .to(toSlide, {
        rotationY: 0,                  /* rolls into full view */
        duration: DUR,
        ease: 'power3.inOut',
      }, 0)

      /* 3. FROM shade: grows as it rotates away (into shadow) */
      .to(fromShade, {
        opacity: 0.72,
        duration: DUR * 0.5,
        ease: 'power2.in',
      }, 0)

      /* 4. TO shade: starts dark, clears as it faces front (out of shadow) */
      .to(toShade, {
        opacity: 0,
        duration: DUR * 0.72,
        ease: 'power2.out',
      }, DUR * 0.28)

      /* 5. TO bg: Ken Burns zoom + drift settles */
      .to(toBg, {
        scale: 1,
        x: 0,
        duration: DUR * 1.15,
        ease: 'smooth',
      }, 0)

      /* 6. FROM bg: drifts in the roll direction (parallax) */
      .to(fromBg, {
        x: dir * -50,
        duration: DUR,
        ease: 'power3.inOut',
      }, 0);
  }
}

/* ════════════════════════════════════
   NAVIGATE
═════════════════════════════════════ */
function navigate(toIdx, fromExternal = false) {
  if (isAnimating || toIdx === activeIdx) return;
  isAnimating = true;

  const fromIdx = activeIdx;
  activeIdx = toIdx;

  /* ARIA + thumbs */
  const fromThumb = getThumb(fromIdx);
  const toThumb   = getThumb(toIdx);
  if (fromThumb) {
    fromThumb.classList.remove('is-active');
    fromThumb.setAttribute('aria-selected', 'false');
    fromThumb.setAttribute('tabindex', '-1');
  }
  if (toThumb) {
    toThumb.classList.add('is-active');
    toThumb.setAttribute('aria-selected', 'true');
    toThumb.setAttribute('tabindex', '0');
    /* Scroll thumb into view on mobile */
    toThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  /* Progress number */
  setProgress(toIdx);

  /* Screen reader */
  announce(`Showing ${SLIDES[toIdx].title}, property ${toIdx + 1} of ${SLIDES.length}`);

  /* Update Swiper silently */
  if (swiper && !fromExternal) swiper.slideTo(toIdx, 0, false);

  /* Pause autoplay bar while animating */
  clearAutoplay();

  /* Run the roll */
  doRoll(fromIdx, toIdx);
}

/* ════════════════════════════════════
   SWIPER INIT
═════════════════════════════════════ */
function initSwiper() {
  swiper = new Swiper('#heroSwiper', {
    virtualTranslate: true,   /* Swiper calculates but doesn't apply CSS transforms */
    speed: 0,                 /* GSAP owns the animation, not Swiper */
    allowTouchMove: true,
    threshold: 20,
    longSwipesRatio: 0.2,
    keyboard: { enabled: false },  /* We handle keyboard ourselves */

    on: {
      init(sw) {
        /* Make first slide visible, hide rest */
        const slides = sw.slides;
        slides.forEach((sl, i) => {
          if (i === 0) {
            gsap.set(sl, { zIndex: 2, display: 'block', visibility: 'visible' });
          } else {
            gsap.set(sl, { zIndex: 0, display: 'none', visibility: 'hidden' });
          }
        });
      },

      slideChangeTransitionStart(sw) {
        /* Swiper detected a swipe — sync our navigate */
        if (!isAnimating) {
          navigate(sw.activeIndex, true);
        }
      },

      setTranslate(sw, translate) {
        /* During interactive drag — subtle parallax feedback */
        if (isAnimating) return;
        const activeSlide = sw.slides[activeIdx];
        if (!activeSlide) return;
        const bg = activeSlide.querySelector('.slide-bg');
        if (bg) {
          const progress = Math.abs(translate / sw.width);
          gsap.set(bg, { x: translate * 0.08 });
          /* Reset if drag released */
        }
      },

      touchEnd(sw) {
        /* Reset parallax if swipe didn't trigger navigation */
        const activeSlide = sw.slides[activeIdx];
        if (!activeSlide) return;
        const bg = activeSlide.querySelector('.slide-bg');
        if (bg) {
          gsap.to(bg, { x: 0, duration: 0.5, ease: 'smooth' });
        }
      },
    },
  });
}

/* ════════════════════════════════════
   EVENT LISTENERS
═════════════════════════════════════ */
/* Button clicks */
prevBtn.addEventListener('click', () => {
  navigate((activeIdx - 1 + SLIDES.length) % SLIDES.length);
});

nextBtn.addEventListener('click', () => {
  navigate((activeIdx + 1) % SLIDES.length);
});

/* Keyboard */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  navigate((activeIdx - 1 + SLIDES.length) % SLIDES.length);
  if (e.key === 'ArrowRight') navigate((activeIdx + 1) % SLIDES.length);
});

/* Pause on hover */
const stage = document.getElementById('heroStage');
stage.addEventListener('mouseenter', pauseAutoplay);
stage.addEventListener('mouseleave', resumeAutoplay);

/* Pause on touch start */
stage.addEventListener('touchstart', pauseAutoplay, { passive: true });
stage.addEventListener('touchend',   resumeAutoplay, { passive: true });

/* Magnetic effect on nav buttons */
document.querySelectorAll('.nav-btn').forEach(btn => {
  const mag = btn.querySelector('.nav-btn__mag');
  btn.addEventListener('mousemove', (e) => {
    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width  / 2;
    const cy = r.top  + r.height / 2;
    const dx = (e.clientX - cx) * 0.35;
    const dy = (e.clientY - cy) * 0.35;
    gsap.to(btn, { x: dx, y: dy, duration: 0.3, ease: 'power2.out', overwrite: true });
  });
  btn.addEventListener('mouseleave', () => {
    gsap.to(btn, { x: 0, y: 0, duration: 0.5, ease: 'elastic.out(1, 0.4)', overwrite: true });
  });
});

/* ════════════════════════════════════
   LOADER
═════════════════════════════════════ */
function runLoader() {
  return new Promise((resolve) => {
    const tl = gsap.timeline({
      onComplete: resolve
    });

    /* Logo fade in */
    tl.to(loaderEl.querySelector('.loader__logo'), {
      opacity: 1, y: 0,
      duration: 0.7, ease: 'smooth',
    }, 0.2);

    /* Bar fills */
    tl.to(loaderBar, {
      width: '100%',
      duration: 1.2,
      ease: 'power2.inOut',
    }, 0.4);

    /* Loader fades out */
    tl.to(loaderEl, {
      opacity: 0,
      duration: 0.5,
      ease: 'power2.inOut',
      onComplete: () => {
        loaderEl.style.display = 'none';
      }
    }, 1.8);
  });
}

/* ════════════════════════════════════
   ENTRY ANIMATION
═════════════════════════════════════ */
function entryAnimation() {
  const firstSlide = getSlide(0);
  const navbar     = document.querySelector('.navbar');
  const thumbItems = document.querySelectorAll('.thumb-item');
  const glassTag   = document.querySelector('.hero__glass-tag');

  const tl = gsap.timeline({
    onComplete: () => {
      textIn(firstSlide);
      startAutoplay();

      /* Scroll hint */
      gsap.to(scrollHint, { opacity: 1, duration: 0.6, delay: 1.2 });
      gsap.to(scrollHint, { opacity: 0, duration: 0.6, delay: 5 });
    }
  });

  /* Navbar */
  gsap.set(navbar, { y: -20, opacity: 0 });
  tl.to(navbar, { y: 0, opacity: 1, duration: 0.7, ease: 'smooth' }, 0);

  /* Hero image reveal */
  if (firstSlide) {
    const bg = firstSlide.querySelector('.slide-bg');
    gsap.set(bg, { scale: 1.08 });
    tl.to(bg, { scale: 1, duration: 1.6, ease: 'smooth' }, 0.3);
  }

  /* Thumbs stagger in */
  gsap.set(thumbItems, { x: -20, opacity: 0 });
  tl.to(thumbItems, {
    x: 0, opacity: 1,
    duration: 0.6, ease: 'smooth',
    stagger: 0.08,
  }, 0.5);

  /* Glass tag */
  if (glassTag) {
    gsap.set(glassTag, { y: -10, opacity: 0 });
    tl.to(glassTag, { y: 0, opacity: 1, duration: 0.6, ease: 'smooth' }, 0.8);
  }

  /* Progress */
  const progEls = [progCurrent, progFill.parentElement, progTotal];
  gsap.set(progEls, { opacity: 0 });
  tl.to(progEls, { opacity: 1, duration: 0.5, stagger: 0.1 }, 0.9);

  /* Nav buttons */
  const navBtns = document.querySelectorAll('.nav-btn');
  gsap.set(navBtns, { scale: 0.8, opacity: 0 });
  tl.to(navBtns, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.4)', stagger: 0.1 }, 1.0);
}

/* ════════════════════════════════════
   INIT
═════════════════════════════════════ */
async function init() {
  /* Initial state — hide loader logo for entrance */
  gsap.set(loaderEl.querySelector('.loader__logo'), { opacity: 0, y: 10 });

  /* Build slide & thumb DOM */
  buildDOM();

  /* Set progress total */
  progTotal.textContent = String(SLIDES.length).padStart(2, '0');
  setProgress(0);

  /* Init Swiper */
  initSwiper();

  /* Run loader then entry */
  await runLoader();
  entryAnimation();
}

/* Start when DOM ready */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
